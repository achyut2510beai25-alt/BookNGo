
<!DOCTYPE html>
<html lang="en">
<head>
  <title>Login | BookNGo</title>
  <link rel="stylesheet" href="style.css">
</head>
<body class="auth-body">

  <div class="auth-box">
    <img src="BookNGo.png" alt="BookNGo Logo" class="auth-logo">
    <h2>Welcome Back</h2>
    <p class="sub">Login to continue booking</p>

    <input type="text"     id="login-user" class="auth-input" placeholder="Username or Email">
    <input type="password" id="login-pwd"  class="auth-input" placeholder="Password">

    <button id="login-btn-id" class="auth-btn">Login</button>

    <p id="login-err" class="err-msg"></p>

    <p class="auth-switch">
      Don't have an account? <a href="signup.html">Sign Up</a>
    </p>
  </div>

  <script src="script.js"></script>
</body>

</html>
